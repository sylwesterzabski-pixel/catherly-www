# Bramki CI (PLAN.md sekcja 5). Wszystkie blokujące — czerwona bramka
# blokuje merge. Czerwień na pustym repo to stan oczekiwany (Faza 0):
# „Pierwszy tydzień z czerwonym CI na pustym repo jest tańszy niż jeden
# dzień zielonego CI, które nic nie sprawdza."
name: bramki

on:
  pull_request:
  push:
    # Gałęzie faz: fotografia bramek przy każdym pushu, zanim powstanie
    # pierwszy PR (ADR-020 kumuluje fazy na gałęziach; workflow_dispatch
    # nie zadziała, dopóki plik nie istnieje na main).
    branches: [main, "faza-*/**"]
  workflow_dispatch:

# JEDEN PRZEBIEG NA GAŁĄŹ (rozstrzygnięcie właściciela 2026-08-19, T22).
#
# Bramka wydajności mierzy WSPÓLNY zasób: alias preview Vercela dla gałęzi.
# Dopóki nic nie pilnowało równoległości, dwa przebiegi tej samej gałęzi
# mierzyły ten sam adres jednocześnie — i mierzyły siebie nawzajem.
# Zdarzyło się 2026-08-19 (przebiegi 32300222841 i 32300453626, commity
# b51d0b8 i 4c22d6d): okna pomiarowe nachodziły przez 5 min 32 s, dokument
# „/" identyczny co do bajta w obu (43 054 B), TTFB 611–615 ms w obu,
# a Render Delay 876 → 1481 ms i werdykt 1491 → 2092 ms. Różnica między
# commitami: 13 linii w dwóch plikach .md. Bez tego bloku wynik pomiaru
# nie daje się przypisać do commita, a niepowtarzalny pomiar jest gorszy
# niż jego brak, bo wygląda jak dowód.
#
# KLUCZ PO GAŁĘZI, NIE PO REF-ie. `github.ref` przy zdarzeniu
# `pull_request` to `refs/pull/N/merge`, a przy `push` — `refs/heads/…`.
# Klucz z samego `github.ref` rozdzieliłby więc dwa przebiegi TEJ SAMEJ
# gałęzi do dwóch grup i defekt wróciłby w ciszy, dokładnie tam, gdzie
# najbardziej boli (PR = moment merge'u). Bierzemy gałąź, którą Vercel
# faktycznie wdraża pod alias — ta sama logika, co przy OCZEKIWANY_COMMIT
# w bramce wydajności (`github.event.pull_request.head.sha || github.sha`).
#
# CENA, ŚWIADOMIE PRZYJĘTA: przy otwartym PR zdarzenia `push`
# i `pull_request` dają dwa przebiegi tego samego commita i teraz jeden
# anuluje drugi. To jest cel (jeden pomiar jednego aliasu), ale gdy
# przegra przebieg z `pull_request`, jego wymagane sprawdzenie pokaże
# „cancelled" i trzeba je powtórzyć przed merge'em. Kierunek awarii jest
# bezpieczny: anulowane ≠ zielone, więc ADR-020 („main zawsze zielony")
# nie ma jak zostać obejściony przez ten blok.
concurrency:
  group: bramki-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (fundament pozostałych bramek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          include-hidden-files: true
          # Bez tego PEŁNY `gh run rerun` pada: artefakt o tej nazwie już na
          # przebiegu jest, a upload-artifact@v4 domyślnie odmawia nadpisania
          # (409). Sprawdzone 2026-08-16 na przebiegu 31955831699 — ratunkiem
          # było `--failed`, czyli obejście, nie naprawa. Powtórzenie przebiegu
          # to normalny ruch przy diagnozie, więc ma po prostu działać.
          overwrite: true
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-kontrakt-tokenow:
    name: "Bramka: Kontrakt tokenów (0 rozjazdów strona↔aplikacja)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:kontrakt
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-tokeny-linter:
    name: "Bramka: Linter tokenów (wartości wizualne tylko z tokens.json)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:tokeny
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-lint:
    name: "Bramka: ESLint (reguły Next/TypeScript egzekwowane przy merge'u)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WPIĘTY 2026-08-19. Do tego dnia `npm run lint` nie był zadaniem CI:
    # eslint przechodził na laptopie autora i nikt go nie egzekwował przy
    # merge'u. Ta sama rodzina defektu, co „spece treści nigdy nie biegły"
    # z 2026-08-14 — narzędzie istnieje, jest zielone i jest bez skutku,
    # bo żaden mechanizm nie zatrzymuje czerwieni. ADR-018: brak dowodu =
    # brak zabezpieczenia, a dowodem jest wykonany przebieg, nie zwyczaj.
    #
    # ZAKRES, ŻEBY NIE BYŁO ZŁUDZEŃ: od 2026-08-19 `npm run lint` to
    # `eslint . --max-warnings=0` — czerwienią kończy się KAŻDY problem,
    # także poziomu WARNING. Wcześniej tego samego dnia próg przepuszczał
    # ostrzeżenia; zaostrzony decyzją właściciela, bo pomiar na commicie
    # d178c26 (2026-08-19) dał 87 plików, 0 błędów, 0 ostrzeżeń, więc
    # zaostrzenie kosztowało zero, a jutro już by nie kosztowało zera.
    # Dowód mutacyjny z kontrolą negatywną w jednym przebiegu
    # (2026-08-19, d178c26): nieużywana zmienna w src/components/Filar.tsx
    # → stare `eslint .` „1 problem (0 errors, 1 warning)", kod wyjścia 0;
    # nowe `eslint . --max-warnings=0` ten sam komunikat plus „ESLint found
    # too many warnings (maximum: 0)", kod wyjścia 1. Ta sama mutacja, dwa
    # progi, jeden przebieg — czerwień pochodzi z progu, nie z otoczenia.
    # Reguły poziomu ERROR czerwieniły już przed zaostrzeniem (mutacja
    # 2026-08-19: hak wywołany warunkowo, react-hooks/rules-of-hooks →
    # „1 problem (1 error)", kod wyjścia 1).
    #
    # Bez `needs: build`: `eslint .` czyta źródła, nie artefakt builda,
    # więc jest sygnałem najszybszym z całego zestawu (3,7 s lokalnie)
    # i nie ma powodu, żeby na cokolwiek czekał.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-parytet:
    name: "Bramka: Parytet językowy (identyczne drzewa pl/en/de)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:parytet
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-prawdziwosc:
    name: "Bramka: Prawdziwość (każda liczba ↔ facts.json)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:liczby
      # Soczewka 5 (agent `claude -p` na wyrenderowanej stronie) dochodzi
      # w Fazie 6 — wymaga klucza API po stronie właściciela (ADR-016).
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-cennik:
    name: "Bramka: Cennik (snapshot Stripe ↔ strona, tryb testowy)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:cennik
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-linki:
    name: "Bramka: Linki (0 martwych linków wewnętrznych)"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npm run bramka:linki
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-kotwice:
    name: "Bramka: Kotwice (0 linków do nieistniejących kotwic)"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npm run bramka:kotwice
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-nojs:
    name: "Bramka: No-JS (treść czytelna bez JavaScriptu)"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npm run bramka:nojs
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-dostepnosc:
    name: "Bramka: Dostępność (axe + klawiatura + nazwy linków + kontrast stanów)"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npx playwright install --with-deps chromium
      # oznaczenie-kierunku.spec.ts DOPISANY 2026-08-14. Bez tej linii
      # oba strażniki (S-NAZWY, S-SYMETRIA) biegałyby wyłącznie lokalnie,
      # a na bramce byłyby martwe — czyli w rejestrze tego projektu
      # NIEISTNIEJĄCE (ADR-018: brak dowodu = brak zabezpieczenia).
      # Dopisany TUTAJ, a nie osobnym jobem: dzieli artefakt builda
      # i instalację chromium z axe, więc kosztuje sekundy zamiast
      # kolejnej pełnej rozgrzewki. Rzecz pilnowana jest zresztą ta
      # sama — nazwa dostępna linku (#11), na którą axe jest ślepe
      # (identical-links-same-purpose: enabled: false w axe-core 4.12.1).
      # kontrast-stanow.spec.ts DOPISANY 2026-08-19, tą samą drogą i z tego
      # samego powodu. Rozstrzygnięcie z 2026-08-17 pkt 2 było wykonane
      # w plikach i niewykonane w systemie: spec istniał, mierzył i świecił
      # zielono — na laptopie autora. Dla CI nie istniał, bo nie był śledzony
      # przez gita. Bramka mająca zamknąć lukę „strażnik nie patrzy tam,
      # gdzie boli" sama była niewidzialna.
      #
      # DOPISANY TUTAJ, a nie jako osobna bramka: pilnuje tej samej rzeczy,
      # co axe — kontrastu AA — tylko w stanach, których axe nie odwiedza.
      # axe mierzy spoczynek; :hover, :focus-visible i :active wymuszamy
      # przez CDP CSS.forcePseudoState. Defekt 1,34:1 na etykiecie CTA
      # (18 wystąpień, naprawiony 2026-08-17) przeszedł obok axe właśnie
      # tędy. Dzieli też artefakt builda i instalację chromium, więc
      # kosztuje sekundy zamiast kolejnej pełnej rozgrzewki.
      - run: npx playwright test e2e/axe.spec.ts e2e/klawiatura.spec.ts e2e/oznaczenie-kierunku.spec.ts e2e/kontrast-stanow.spec.ts
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-e2e:
    name: "Bramka: E2E (cennik → płatność → konto → aplikacja)"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/sciezka-zakupu.spec.ts
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-pelny-zestaw:
    name: "Bramka: Pełny zestaw e2e (każdy spec, oba projekty)"
    runs-on: ubuntu-latest
    needs: build
    # 20, nie 10 (właściciel 2026-08-23). Zadanie zmierzono na 5 min 23 s
    # (2026-08-20), więc limit 10 dawał zapas 1,86× — za mało przy zadaniu,
    # które instaluje przeglądarkę i uruchamia każdy spec w obu projektach.
    # Przekroczenie z powodu obciążenia runnera dałoby czerwień, która nie
    # jest werdyktem — czyli dokładnie defekt opisany w T24, nie jego naprawę.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npx playwright install --with-deps chromium
      # DZIURA ZAŁATANA 2026-08-14 (zlecenie właściciela, klasa
      # security-scan). Do tego dnia CI uruchamiało 4 spece z 17:
      # axe, klawiatura, oznaczenie-kierunku i sciezka-zakupu. Trzynaście
      # pozostałych — cały dorobek strażniczy Etapów B, C i D, w tym
      # funkcje-podstrony.spec.ts z 76 testami — biegało WYŁĄCZNIE
      # lokalnie. W rejestrze tego projektu znaczy to, że nie istniały:
      # ADR-018, „brak dowodu = brak zabezpieczenia". Zielona suita na
      # laptopie autora nie jest dowodem, bo nikt jej nie egzekwuje.
      #
      # Świadomie BEZ listy plików. Lista jest dokładnie tym mechanizmem,
      # który tę dziurę wytworzył: każdy nowy spec wymagał pamiętania
      # o dopisaniu, a zapomnienie nie dawało żadnego sygnału — bramka
      # była zielona, po prostu niczego nie sprawdzała. `npx playwright
      # test` bez filtra bierze wszystko z testDir, więc osierocenie
      # speca przestaje być możliwe konstrukcyjnie, a nie przez czujność.
      #
      # Nakładanie się z bramkami Dostępność i E2E jest zamierzone.
      # Tamte zostają, bo są osobnymi pozycjami rejestru bramek i dają
      # szybki, konkretny sygnał („padła dostępność", nie „padło e2e").
      # Koszt dublowania: 39 testów z 272 na projekt, kilka sekund.
      - run: npx playwright test
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-wydajnosc:
    name: "Bramka: Wydajność (LCP < 1,8 s · CLS < 0,1 · TBT < 200 ms)"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      # Cel pomiaru sterowany zmienną repozytorium LHCI_BAZA
      # (Settings → Variables). Ustawiona → mierzymy preview Vercela.
      # Nieustawiona → lokalny build produkcyjny, jak dotąd. Próg 1800
      # identyczny w obu trybach.
      #
      # Reguły werdyktu ANI liczby przebiegów NIE ma w tym pliku i mieć
      # nie będzie: stał tu opis „MEDIANA z 3 przebiegów", który przeżył
      # zmianę na median-run i zdezaktualizował się w ciszy. Jedyne
      # źródło to lighthouserc.cjs; adnotacja kroku „Tryb pomiaru" czyta
      # je stamtąd i wypisuje do logu przy każdym przebiegu.
      #
      # Strażnik przed pomiarem jest tu OBOWIĄZKOWY, nie ozdobny, i pilnuje
      # DWÓCH rzeczy naraz:
      #  (1) że pod adresem stoi strona Catherly, a nie ekran logowania
      #      Vercela — ten oddaje status 200 i zawiera słowo „Catherly"
      #      (adres siedzi w parametrze `next=`), więc Lighthouse zmierzyłby
      #      go i oddał świetne wyniki: bramka zielona, nic zmierzone;
      #  (2) że to wdrożenie TEGO commita, nie poprzedniego ani z innej
      #      gałęzi — adres w LHCI_BAZA jest stały, wdrożenie pod nim nie.
      #      Rozstrzyga nagłówek x-catherly-wydanie (next.config.ts);
      #      strażnik czeka, aż deploy Vercela dogoni commita, i dopiero
      #      po upływie okna daje czerwień.
      # Obie dziury są tej samej klasy co spece poza workflow: zielono,
      # bo pusto albo bo nie to.
      - name: "Strażnik celu pomiaru (tryb preview)"
        if: ${{ vars.LHCI_BAZA != '' }}
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Commit, który ma zostać zmierzony. Przy `pull_request` GITHUB_SHA
          # jest sha commita scalającego, którego Vercel nie buduje — bierzemy
          # głowę gałęzi, czyli to, co Vercel faktycznie wdraża.
          OCZEKIWANY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CZEKANIE_NA_WDROZENIE_S: "420"
        run: npm run bramka:preview
      # Rozgrzewka (O3). Musi stać MIĘDZY strażnikiem a pomiarem: przed
      # nią adres bywa jeszcze cudzym wdrożeniem, po niej mierzy już
      # Lighthouse. `lhci collect` pętli przebiegami wewnątrz adresu,
      # więc bez tego kroku przebieg #1 KAŻDEJ trasy płaci za zimną
      # krawędź CDN, a przy median-run taki przebieg potrafi zostać
      # reprezentantem i to on wyznaczy werdykt. Zmierzone z laptopa na
      # żywym preview: sam dokument „/" to 922 ms zimno wobec 170 ms
      # ciepło. Krok pobiera też zasoby stron, bo LCP wisi na nich, a nie
      # na dokumencie. Jest strażnikiem — sprawdza status i wydanie na
      # WSZYSTKICH siedmiu trasach, nie tylko na „/" jak krok wyżej.
      - name: "Rozgrzewka celu pomiaru (tryb preview)"
        if: ${{ vars.LHCI_BAZA != '' }}
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OCZEKIWANY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run bramka:rozgrzewka
      # Adnotacja, nie strażnik — nie potrafi zapalić czerwieni. Mówi, na
      # jakim transporcie mierzymy i jak czytać wynik. Do czasu przeniesienia
      # pomiaru na preview czerwień na „/" jest czerwienią TERMOMETRU, nie
      # strony (rozstrzygnięcie właściciela 2026-08-16 po rozbiorze render
      # delay); bez tej adnotacji ktoś zacząłby ciąć stronę pod złe
      # narzędzie. Liczby z rejestru, nie z YAML-a.
      - name: "Tryb pomiaru i jak czytać wynik"
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
        run: npm run bramka:tryb-pomiaru
      # Było `lhci autorun`, czyli collect+assert w jednym procesie. Rozbite na
      # dwa kroki 2026-08-16, bo między pomiar a wyrok trzeba wstawić WYBÓR
      # REPREZENTANTA: `median-run` z lhci wybiera przebieg po medianach FCP
      # i TTI, a werdykt stoi na LCP — na `/dla-kogo` dało to czerwień −134 ms
      # przy medianie LCP 312 ms POD progiem. `npm run bramka:pomiar` =
      # `lhci collect` + scripts/werdykt-po-lcp.mjs, który podaje `lhci assert`
      # jeden przebieg na trasę. Progi zostają w lighthouserc.cjs, nietknięte.
      - name: Pomiar
        id: pomiar
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run bramka:pomiar
      # DRUGIE RAMIĘ KLAMRY PROWIENIENCJI (właściciel 2026-08-19, T22 b).
      # Strażnik i rozgrzewka sprawdzają wydanie PRZED pomiarem i mówią
      # o jednej chwili; alias preview jest przestawialny w każdej sekundzie.
      # Bez tego kroku pomiar mógł zacząć się na jednym commicie, skończyć
      # na drugim i zameldować liczbę przypisaną do commita, którego ona nie
      # dotyczy — dokładnie to zdarzyło się 2026-08-19 (T22). `always()`,
      # bo unieważnienie jest najbardziej potrzebne wtedy, gdy pomiar właśnie
      # zapalił czerwień: czerwień nieprzypisywalna to nie jest diagnoza.
      # WYNIK_POMIARU steruje wyłącznie BRZMIENIEM komunikatu, nie werdyktem.
      - name: "Prowieniencja po pomiarze (klamra: to samo wdrożenie na końcu)"
        if: always()
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          OCZEKIWANY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          WYNIK_POMIARU: ${{ steps.pomiar.outcome }}
        run: npm run bramka:po-pomiarze
      # `lhci assert` drukuje WYŁĄCZNIE to, co nie przeszło — o trasach
      # zielonych milczy, a ich raporty giną razem z runnerem. Po pierwszym
      # przebiegu na preview (e2ac0f3) nie dało się więc odpowiedzieć na
      # pytanie „LCP wszystkich 7 tras", ani odróżnić trasy stojącej 400 ms
      # pod progiem od takiej, która ociera się o niego i spadnie następnym
      # razem bez żadnej zmiany w kodzie. `always()`, bo najbardziej
      # potrzebne jest to wtedy, gdy pomiar właśnie zapalił czerwień.
      - name: "Liczby ze wszystkich tras"
        if: always()
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
        run: npm run bramka:podsumowanie
      # WERDYKT MARGINESU (właściciel 2026-08-19, T22 c). Linijka „⚠ rozrzut
      # większy niż zapas" istniała w logu od 2026-08-16 i była wypisana
      # dla „/" w OBU przebiegach doby 2026-08-19 — także w tym ZIELONYM.
      # Nikt jej nie przeczytał, bo siedziała w kilkuset linijkach logu
      # zielonego zadania. Klasa nazwana przez właściciela: „raport, którego
      # nikt nie czyta, przestaje być raportem".
      #
      # `continue-on-error` NIE jest tu osłabieniem bramki, tylko jedynym
      # sposobem na ŻÓŁTY, jaki GitHub daje w obrębie jednego zadania:
      # zadanie ma wyłącznie success/failure, więc „żółty" istnieje jako
      # (1) krok z ⚠ zamiast zielonego znaczka, (2) adnotacja `::warning`
      # na stronie podsumowania przebiegu — NAD listą zadań, czyli tam,
      # gdzie patrzy ktoś, kto logu nie otworzy, (3) blok w $GITHUB_STEP_SUMMARY.
      # Werdykt progowy zostaje nietknięty w kroku „Pomiar". Zdjęcie
      # `continue-on-error` zamienia ten żółty w czerwień blokującą — to jedna
      # linia i decyzja właściciela, nie zmiana konstrukcji.
      - name: "Werdykt marginesu (żółty: margines pozorny)"
        if: always()
        continue-on-error: true
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
        run: npm run bramka:margines
      # Raporty HTML: z tabeli wiadomo KTÓRA trasa i ile, z raportu — który
      # element jest LCP i z czego składa się jego czas (rozbiór fazowy).
      # Bez tego diagnoza czerwieni zaczyna się od zgadywania.
      - name: "Raporty Lighthouse (do rozbioru czerwieni)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-raporty
          path: .lighthouseci/*.html
          retention-days: 7
          if-no-files-found: ignore
          # BEZ TEGO ARTEFAKT JEST PUSTY. `.lighthouseci/` zaczyna się od
          # kropki, a upload-artifact od v4.4 domyślnie pomija pliki i
          # katalogi ukryte — pierwszy przebieg (31952572831) zameldował
          # „No files were found" i przeszedł dalej zielono, bo krok ma
          # `if-no-files-found: ignore`. Cicha pustka w artefakcie, czyli
          # dokładnie ten rodzaj zieleni, przed którym stoi ADR-018.
          include-hidden-files: true
          # Powód ten sam co przy `next-build`: bez tego pełny rerun pada na 409.
          overwrite: true
      # Interpretacja OBOK wyniku, nie kilkaset linii wyżej.
      - name: "Jak czytać tę czerwień"
        if: failure()
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
        run: npm run bramka:tryb-pomiaru -- --po-czerwieni
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."

  bramka-nieodwracalne:
    name: "Bramka: Nieodwracalne (ADR-018 — raport audytu dla commita)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:nieodwracalne
      - name: "Przyczyna anulowania"
        if: cancelled()
        run: |
          echo "::warning title=Anulowanie::Zbadaj czas trwania: krotki (sekundy) = wyparcie przez concurrency, oczekiwane; bliski timeout-minutes = limit przekroczony, brak werdyktu."
