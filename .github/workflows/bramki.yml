# Bramki CI (PLAN.md sekcja 5). Wszystkie blokujące — czerwona bramka
# blokuje merge. Czerwień na pustym repo to stan oczekiwany (Faza 0):
# „Pierwszy tydzień z czerwonym CI na pustym repo jest tańszy niż jeden
# dzień zielonego CI, które nic nie sprawdza."
name: bramki

on:
  pull_request:
  push:
    # Gałęzie faz: fotografia bramek przy każdym pushu, zanim powstanie
    # pierwszy PR (ADR-020 kumuluje fazy na gałęziach; workflow_dispatch
    # nie zadziała, dopóki plik nie istnieje na main).
    branches: [main, "faza-*/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build (fundament pozostałych bramek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          include-hidden-files: true

  bramka-kontrakt-tokenow:
    name: "Bramka: Kontrakt tokenów (0 rozjazdów strona↔aplikacja)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:kontrakt

  bramka-tokeny-linter:
    name: "Bramka: Linter tokenów (wartości wizualne tylko z tokens.json)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:tokeny

  bramka-parytet:
    name: "Bramka: Parytet językowy (identyczne drzewa pl/en/de)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:parytet

  bramka-prawdziwosc:
    name: "Bramka: Prawdziwość (każda liczba ↔ facts.json)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:liczby
      # Soczewka 5 (agent `claude -p` na wyrenderowanej stronie) dochodzi
      # w Fazie 6 — wymaga klucza API po stronie właściciela (ADR-016).

  bramka-cennik:
    name: "Bramka: Cennik (snapshot Stripe ↔ strona, tryb testowy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:cennik
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

  bramka-linki:
    name: "Bramka: Linki (0 martwych linków wewnętrznych)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npm run bramka:linki

  bramka-kotwice:
    name: "Bramka: Kotwice (0 linków do nieistniejących kotwic)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npm run bramka:kotwice

  bramka-nojs:
    name: "Bramka: No-JS (treść czytelna bez JavaScriptu)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npm run bramka:nojs

  bramka-dostepnosc:
    name: "Bramka: Dostępność (axe 0 błędów + klawiatura + nazwy linków)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npx playwright install --with-deps chromium
      # oznaczenie-kierunku.spec.ts DOPISANY 2026-08-14. Bez tej linii
      # oba strażniki (S-NAZWY, S-SYMETRIA) biegałyby wyłącznie lokalnie,
      # a na bramce byłyby martwe — czyli w rejestrze tego projektu
      # NIEISTNIEJĄCE (ADR-018: brak dowodu = brak zabezpieczenia).
      # Dopisany TUTAJ, a nie osobnym jobem: dzieli artefakt builda
      # i instalację chromium z axe, więc kosztuje sekundy zamiast
      # kolejnej pełnej rozgrzewki. Rzecz pilnowana jest zresztą ta
      # sama — nazwa dostępna linku (#11), na którą axe jest ślepe
      # (identical-links-same-purpose: enabled: false w axe-core 4.12.1).
      - run: npx playwright test e2e/axe.spec.ts e2e/klawiatura.spec.ts e2e/oznaczenie-kierunku.spec.ts

  bramka-e2e:
    name: "Bramka: E2E (cennik → płatność → konto → aplikacja)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/sciezka-zakupu.spec.ts

  bramka-pelny-zestaw:
    name: "Bramka: Pełny zestaw e2e (każdy spec, oba projekty)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      - run: npx playwright install --with-deps chromium
      # DZIURA ZAŁATANA 2026-08-14 (zlecenie właściciela, klasa
      # security-scan). Do tego dnia CI uruchamiało 4 spece z 17:
      # axe, klawiatura, oznaczenie-kierunku i sciezka-zakupu. Trzynaście
      # pozostałych — cały dorobek strażniczy Etapów B, C i D, w tym
      # funkcje-podstrony.spec.ts z 76 testami — biegało WYŁĄCZNIE
      # lokalnie. W rejestrze tego projektu znaczy to, że nie istniały:
      # ADR-018, „brak dowodu = brak zabezpieczenia". Zielona suita na
      # laptopie autora nie jest dowodem, bo nikt jej nie egzekwuje.
      #
      # Świadomie BEZ listy plików. Lista jest dokładnie tym mechanizmem,
      # który tę dziurę wytworzył: każdy nowy spec wymagał pamiętania
      # o dopisaniu, a zapomnienie nie dawało żadnego sygnału — bramka
      # była zielona, po prostu niczego nie sprawdzała. `npx playwright
      # test` bez filtra bierze wszystko z testDir, więc osierocenie
      # speca przestaje być możliwe konstrukcyjnie, a nie przez czujność.
      #
      # Nakładanie się z bramkami Dostępność i E2E jest zamierzone.
      # Tamte zostają, bo są osobnymi pozycjami rejestru bramek i dają
      # szybki, konkretny sygnał („padła dostępność", nie „padło e2e").
      # Koszt dublowania: 39 testów z 272 na projekt, kilka sekund.
      - run: npx playwright test

  bramka-wydajnosc:
    name: "Bramka: Wydajność (LCP < 1,8 s · CLS < 0,1 · TBT < 200 ms)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: next-build, path: .next/ }
      # Cel pomiaru sterowany zmienną repozytorium LHCI_BAZA
      # (Settings → Variables). Ustawiona → mierzymy preview Vercela
      # i werdyktem jest MEDIANA z 3 przebiegów. Nieustawiona → lokalny
      # build produkcyjny, jak dotąd. Próg 1800 identyczny w obu trybach.
      # Szczegóły i uzasadnienie wiązania mediany z trybem: nagłówek
      # lighthouserc.cjs.
      #
      # Strażnik przed pomiarem jest tu OBOWIĄZKOWY, nie ozdobny, i pilnuje
      # DWÓCH rzeczy naraz:
      #  (1) że pod adresem stoi strona Catherly, a nie ekran logowania
      #      Vercela — ten oddaje status 200 i zawiera słowo „Catherly"
      #      (adres siedzi w parametrze `next=`), więc Lighthouse zmierzyłby
      #      go i oddał świetne wyniki: bramka zielona, nic zmierzone;
      #  (2) że to wdrożenie TEGO commita, nie poprzedniego ani z innej
      #      gałęzi — adres w LHCI_BAZA jest stały, wdrożenie pod nim nie.
      #      Rozstrzyga nagłówek x-catherly-wydanie (next.config.ts);
      #      strażnik czeka, aż deploy Vercela dogoni commita, i dopiero
      #      po upływie okna daje czerwień.
      # Obie dziury są tej samej klasy co spece poza workflow: zielono,
      # bo pusto albo bo nie to.
      - name: "Strażnik celu pomiaru (tryb preview)"
        if: ${{ vars.LHCI_BAZA != '' }}
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Commit, który ma zostać zmierzony. Przy `pull_request` GITHUB_SHA
          # jest sha commita scalającego, którego Vercel nie buduje — bierzemy
          # głowę gałęzi, czyli to, co Vercel faktycznie wdraża.
          OCZEKIWANY_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CZEKANIE_NA_WDROZENIE_S: "420"
        run: npm run bramka:preview
      # Adnotacja, nie strażnik — nie potrafi zapalić czerwieni. Mówi, na
      # jakim transporcie mierzymy i jak czytać wynik. Do czasu przeniesienia
      # pomiaru na preview czerwień na „/" jest czerwienią TERMOMETRU, nie
      # strony (rozstrzygnięcie właściciela 2026-08-16 po rozbiorze render
      # delay); bez tej adnotacji ktoś zacząłby ciąć stronę pod złe
      # narzędzie. Liczby z rejestru, nie z YAML-a.
      - name: "Tryb pomiaru i jak czytać wynik"
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
        run: npm run bramka:tryb-pomiaru
      - name: Pomiar
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx lhci autorun
      # Interpretacja OBOK wyniku, nie kilkaset linii wyżej.
      - name: "Jak czytać tę czerwień"
        if: failure()
        env:
          LHCI_BAZA: ${{ vars.LHCI_BAZA }}
        run: npm run bramka:tryb-pomiaru -- --po-czerwieni

  bramka-nieodwracalne:
    name: "Bramka: Nieodwracalne (ADR-018 — raport audytu dla commita)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run bramka:nieodwracalne
